name: Bug Report
description: Report an issue or bug in JobPulse AI
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it.
  - type: input
    id: environment
    attributes:
      label: Environment & Operating System
      description: What OS and versions are you using?
      placeholder: Windows 11, Node.js 20.10, Python 3.11.9, Chrome 124
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this behavior?
      placeholder: |
        1. Start backend with `python run.py`
        2. Navigate to '...'
        3. Click on '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Terminal Output
      description: Please copy and paste any terminal errors or browser console output (ensure secrets and passwords are redacted).
      render: shell
